[project]
name = "san-francisco-rally"
version = "0.1.0"
description = "On-device AI models race taxis through real San Francisco streets, on the Snapdragon NPU"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "sse-starlette>=2.1",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8.0", "ruff>=0.5", "types-PyYAML"]

[project.scripts]
san-francisco-rally = "san_francisco.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
