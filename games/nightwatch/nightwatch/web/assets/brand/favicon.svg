<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2f57"/>
      <stop offset="1" stop-color="#0a1226"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)" stroke="#3a5088" stroke-width="2"/>
  <!-- watch bezel: three quiet ticks around the doorway (the floor is the fourth side) -->
  <g stroke="#5f77b3" stroke-width="2.4" stroke-linecap="round">
    <path d="M32 7.5v3.5M53 32h3.5M7.5 32H11"/>
  </g>
  <!-- the doorway (an exit, watched over) -->
  <path d="M19 52V30a13 13 0 0 1 26 0v22" fill="none" stroke="#cdd9ff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M14 52.5h36" stroke="#cdd9ff" stroke-width="3.6" stroke-linecap="round"/>
  <!-- crescent moon inside the arch -->
  <path d="M30.61 18.86A8.2 8.2 0 1 0 39.18 30.14A7.4 7.4 0 0 1 30.61 18.86Z" fill="#ffd27a"/>
  <!-- door handle / the one steady light at night -->
  <circle cx="39.4" cy="42.5" r="2.3" fill="#3ddc97"/>
</svg>
