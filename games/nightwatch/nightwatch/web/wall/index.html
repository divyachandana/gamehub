<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NightWatch · Wall display</title>
<script src="/assets/auth.js"></script>
<link rel="stylesheet" href="/assets/theme.css">
<style>
  html, body { height: 100%; overflow-x: hidden; }
  body.nw { display: flex; flex-direction: column; min-height: 100vh; transition: background-color .6s; }
  body.nw.is-day { background: radial-gradient(1200px 700px at 80% -10%, rgba(255, 210, 122, .08), transparent 60%), #0b0f19; }

  .bar { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: clamp(12px, 2vh, 22px) clamp(16px, 3vw, 40px); }
  .bar .fac { font: 700 clamp(16px, 1.6vw, 24px)/1.2 var(--nw-font-display); color: var(--nw-ink-2); min-width: 0; overflow-wrap: anywhere; }
  .bar .nw-mode { font-size: clamp(13px, 1.2vw, 18px); padding: 6px 16px 6px 12px; }
  .bar .sp { flex: 1; }
  .bar .small-clock { font: 750 clamp(22px, 2.6vw, 40px)/1 var(--nw-font-display); font-variant-numeric: tabular-nums; }
  #fs { min-height: 44px; }
  :fullscreen #fs { display: none; }

  main { flex: 1; display: flex; flex-direction: column; padding: 0 clamp(16px, 3vw, 40px) clamp(16px, 3vh, 32px); }

  /* ---------------------------------------------------------------- calm */
  .calm { flex: 1; display: grid; place-content: center; text-align: center; gap: clamp(8px, 2vh, 24px); }
  .calm .big-clock { font: 760 clamp(72px, 19vw, 300px)/.95 var(--nw-font-display); letter-spacing: -.04em; font-variant-numeric: tabular-nums; color: var(--nw-ink); }
  .is-night .calm .big-clock { color: var(--nw-moon); }
  .calm .ok { display: inline-flex; align-items: center; justify-content: center; gap: .4em; font: 750 clamp(30px, 5vw, 80px)/1.1 var(--nw-font-display); color: var(--nw-ok); }
  .calm .ok .nw-ico { width: 1em; height: 1em; }
  .calm .sub { color: var(--nw-muted); font-size: clamp(16px, 1.8vw, 28px); }

  /* ---------------------------------------------------------------- alert takeover */
  .alert { flex: 1; display: flex; flex-direction: column; gap: clamp(8px, 1.6vh, 22px); border: clamp(4px, .6vw, 10px) solid var(--lvl); border-radius: clamp(16px, 2vw, 32px);
           background: linear-gradient(180deg, var(--lvl-bg), rgba(7, 11, 20, .6)); padding: clamp(14px, min(3vw, 4vh), 48px); }
  .alert .lv { display: flex; flex-wrap: wrap; align-items: center; gap: 0 .3em; font: 850 clamp(34px, min(10vw, 15vh), 170px)/.95 var(--nw-font-display); letter-spacing: -.02em; color: var(--lvl); }
  .alert .lv .nw-ico { width: .9em; height: .9em; stroke-width: 2.4; }
  .alert .lv small { font-size: .26em; letter-spacing: .04em; color: var(--nw-ink-2); font-weight: 700; margin-left: .4em; align-self: center; }
  .alert .who { font: 780 clamp(26px, min(5vw, 7.5vh), 84px)/1.05 var(--nw-font-display); overflow-wrap: anywhere; }
  .alert .where { font-size: clamp(18px, min(2.7vw, 4.2vh), 44px); color: var(--nw-ink); line-height: 1.2; overflow-wrap: anywhere; }
  .alert .row { display: flex; flex-wrap: wrap; gap: clamp(8px, min(2vw, 2vh), 28px); align-items: stretch; }
  .alert .fact { background: rgba(7, 11, 20, .55); border: 1px solid var(--nw-line-strong); border-radius: 16px; padding: clamp(8px, min(1.4vw, 1.6vh), 20px) clamp(12px, 1.8vw, 26px); min-width: 0; }
  .alert .fact .k { color: var(--nw-muted); font-size: clamp(11px, min(1.1vw, 1.8vh), 18px); font-weight: 750; letter-spacing: .1em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .alert .fact .v { font: 780 clamp(22px, min(3.6vw, 5.8vh), 60px)/1.1 var(--nw-font-display); font-variant-numeric: tabular-nums; margin-top: 4px; overflow-wrap: anywhere; }
  .alert .fact .v.sm { font-size: clamp(16px, min(2vw, 3.3vh), 32px); font-weight: 700; }
  .alert .fact.grow { flex: 1 1 320px; }
  .alert .helped { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 2px; font-size: clamp(15px, min(1.8vw, 2.9vh), 30px); color: var(--nw-ink); }
  .alert .helped li { display: flex; gap: 10px; align-items: baseline; }
  .alert .helped li::before { content: "✓"; color: var(--nw-ok); font-weight: 800; }
  .alert .helped.contacts li::before { content: "→"; color: #ff8a96; }
  .alert .acked { color: var(--nw-ok); }
  .alert .noans { color: var(--lvl); }

  /* level 3: unmistakable. Solid red field, white text, pulsing frame (static stripes if reduced motion). */
  .alert.nw-l3 { background: #4a0710; border-color: #ff5263; }
  .alert.nw-l3 .lv { color: #fff; }
  .alert.nw-l3 .lv .nw-ico { color: #ff8a96; }
  body.lvl3 { background: #22040a; }
  body.lvl3 .bar { background: repeating-linear-gradient(135deg, #ff5263 0 22px, #22040a 22px 44px); }
  body.lvl3 .bar > :not(.sp) { background: #22040a; border-radius: 10px; padding: 4px 10px; }
  @keyframes wall-l3 { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 82, 99, 0), inset 0 0 0 0 rgba(255, 82, 99, 0); } 50% { box-shadow: 0 0 0 10px rgba(255, 82, 99, .35), inset 0 0 80px rgba(255, 82, 99, .45); } }
  .alert.nw-l3:not(.is-acked) { animation: wall-l3 1.1s ease-in-out infinite; }   /* calms once someone is going */
  @media (prefers-reduced-motion: reduce) {
    body.nw { transition: none; }
    .alert.nw-l3 { animation: none; box-shadow: inset 0 0 0 6px #22040a, inset 0 0 0 14px #ff5263; }
  }

  .others { margin-top: clamp(10px, 2vh, 20px); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .others .k { color: var(--nw-muted); font-size: clamp(13px, 1.2vw, 18px); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  .others .o { display: inline-flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--lvl); background: var(--lvl-bg);
               font-size: clamp(15px, 1.5vw, 22px); max-width: 100%; overflow-wrap: anywhere; }
  .others .o b { color: var(--lvl); }

  /* connection lost: never show a stale "All quiet" as if it were current */
  .lost { display: none; align-items: center; gap: 12px; margin: 0 clamp(16px, 3vw, 40px) 12px; padding: 12px 18px; border-radius: 14px;
          border: 2px dashed var(--nw-l1); background: var(--nw-l1-bg); color: var(--nw-ink); font-size: clamp(16px, 1.8vw, 26px); font-weight: 700; }
  .lost .nw-ico { width: 1.3em; height: 1.3em; color: var(--nw-l1); }
  body.is-lost .lost { display: flex; }
  body.is-lost main { opacity: .45; filter: grayscale(.7); }

  .foot { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; color: var(--nw-faint); font-size: clamp(12px, 1.1vw, 16px); padding: 0 16px 14px; }
  .foot span { display: inline-flex; align-items: center; gap: 6px; }

  @media (max-width: 600px) {
    .alert { border-width: 4px; }
    .alert .row { flex-direction: column; }
    .alert .fact.grow { flex-basis: auto; }
  }
</style>
</head>
<body class="nw">
<header class="bar">
  <div class="nw-brand-mark" id="logo" aria-hidden="true"></div>
  <div class="fac" id="fac">NightWatch</div>
  <span id="mode"></span>
  <span class="sp"></span>
  <span class="small-clock" id="sclock" hidden></span>
  <button class="nw-btn nw-btn--ghost" id="fs" type="button">Full screen</button>
</header>
<div class="lost" id="lost" role="alert"></div>
<main id="main" aria-live="assertive" aria-atomic="true"></main>
<div class="foot" id="foot"></div>

<script src="/assets/nw.js"></script>
<script>
(() => {
const { esc, icon } = NW;
const $ = (id) => document.getElementById(id);
$('logo').innerHTML = icon('logo');
$('fs').innerHTML = `${icon('window')}Full screen`;
if (!document.fullscreenEnabled) $('fs').hidden = true;
$('fs').onclick = () => document.documentElement.requestFullscreen().catch(() => {});
document.addEventListener('keydown', (e) => { if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && document.fullscreenEnabled && !document.fullscreenElement) $('fs').click(); });

let S = null, gotAt = 0, fails = 0, lastKey = '';

const ago = (secs) => { secs = Math.max(0, Math.round(secs)); const m = Math.floor(secs / 60), s = secs % 60; return m ? `${m} min ${String(s).padStart(2, '0')} s` : `${s} s`; };
const ZONES = { room: 'in their room', corridor: 'in the corridor', common: 'in the common room', exit: 'at an exit', outside: 'OUTSIDE the building' };

function whereText(a, r) {
  const ex = a.exit && S.exits.find((e) => e.id === a.exit);
  const parts = [];
  if (r && r.zone === 'outside') parts.push(`Outside${ex ? `, through the ${ex.label.toLowerCase()}` : ''}`);
  else {
    if (ex) parts.push(`${ex.label}`);
    if (r && ZONES[r.zone] && r.zone !== 'exit') parts.push(`last seen ${ZONES[r.zone]}${r.zone === 'room' && r.room ? ` (room ${r.room})` : ''}`);
    else if (r && r.zone === 'exit' && !ex) parts.push('at an exit');
  }
  return parts.join(' · ');
}

function renderCalm() {
  document.body.classList.remove('lvl3');
  $('sclock').hidden = true;
  const cams = S.cameras.filter((c) => NW.camState(c).key !== 'off').length;
  return `<div class="calm">
    <div class="big-clock nw-num">${esc(S.clock.slice(0, 5))}</div>
    <div class="ok">${icon('check')}All quiet</div>
    <div class="sub">${S.night ? `Night mode · ${esc(NW.nightBand(S).label)}` : 'Day mode · doors are logged as visits'} · ${S.stats.alerts ? `${S.stats.alerts} alert${S.stats.alerts > 1 ? 's' : ''} earlier, all closed` : 'no alerts'}</div></div>`;
}

function renderAlert(a, rest, extra) {
  const L = NW.LEVELS[a.level], r = S.residents.find((x) => x.id === a.resident);
  document.body.classList.toggle('lvl3', a.level === 3);
  $('sclock').hidden = false;
  const age = a.age_s + extra;
  const status = a.acked_by
    ? `<div class="v sm acked">${icon('check')} ${esc(a.acked_by)} is going</div>`
    : `<div class="v sm noans">Nobody has answered${a.escalates_in_s != null && a.level < 3 ? ` · climbs in ${Math.max(0, Math.round(a.escalates_in_s - extra))} s` : ''}</div>`;
  const contacts = a.level === 3 ? a.history.filter(([, h]) => NW.histKind(h) === 'contact').map(([, h]) => h) : [];
  const helped = (a.suggestions || []).slice(0, 2);
  return `<section class="alert nw-l${a.level}${a.acked_by ? ' is-acked' : ''}" aria-label="${esc(L.name)} alert">
      <div class="lv">${icon(L.icon)}${esc(L.word)}<small>Level ${a.level} of 3</small></div>
      <div class="who">${esc(r ? r.name : a.resident || 'Unknown resident')}${a.room ? ` · Room ${esc(a.room)}` : ''}</div>
      <div class="where">${esc(whereText(a, r) || a.title)}</div>
      <div class="row">
        <div class="fact"><div class="k">${icon('clock')}Since</div><div class="v">${esc(ago(age))}</div></div>
        <div class="fact grow"><div class="k">${icon('user')}Response</div>${status}</div>
        ${a.description ? `<div class="fact grow"><div class="k">${icon('eye')}Look for</div><div class="v sm">${esc(a.description)}</div></div>` : ''}
      </div>
      ${helped.length || contacts.length ? `<div class="row">
        ${helped.length ? `<div class="fact grow"><div class="k">${icon('heart')}What has worked for them</div><ul class="helped">${helped.map((h) => `<li>${esc(h)}</li>`).join('')}</ul></div>` : ''}
        ${contacts.length ? `<div class="fact grow"><div class="k">${icon('phone')}Contacted so far</div><ul class="helped contacts">${contacts.map((h) => `<li>${esc(h)}</li>`).join('')}</ul></div>` : ''}</div>` : ''}
    </section>
    ${rest.length ? `<div class="others"><span class="k">Also open</span>${rest.map((o) => `<span class="o nw-l${o.level}">${icon(NW.LEVELS[o.level].icon)}<b>${esc(NW.LEVELS[o.level].word)}</b>${esc(o.title)}</span>`).join('')}</div>` : ''}`;
}

function render() {
  if (!S) return;
  const extra = (Date.now() - gotAt) / 1000;
  document.body.classList.toggle('is-night', S.night); document.body.classList.toggle('is-day', !S.night);
  $('fac').textContent = S.facility;
  $('mode').innerHTML = `<span class="nw-mode ${S.night ? 'is-night' : 'is-day'}">${icon(S.night ? 'moon' : 'sun')}${S.night ? 'NIGHT' : 'DAY'}</span>`;
  $('sclock').textContent = S.clock.slice(0, 5);
  const [a, ...rest] = S.alerts;
  const html = a ? renderAlert(a, rest, extra) : renderCalm();
  // Rebuild only when something changed, so screen readers aren't flooded (time ticks are visual).
  const key = a ? `${a.id}:${a.level}:${a.acked_by}:${a.history.length}:${rest.map((o) => o.id + '.' + o.level).join()}` : `calm:${S.night}:${S.stats.alerts}`;
  const main = $('main');
  if (key !== lastKey) { main.setAttribute('aria-live', 'assertive'); lastKey = key; } else main.setAttribute('aria-live', 'off');
  main.innerHTML = html;
  const cams = S.cameras.map((c) => `${esc(c.label.replace(/ camera$/i, ''))}: ${esc(NW.camState(c).long.toLowerCase())}`).join(' · ');
  $('foot').innerHTML = `<span>${icon('shield')}Runs on this laptop · nothing sent</span><span>${icon('camera')}${cams}</span><span>${icon('user')}${S.night_staff} night staff</span>`;
}

async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    S = await r.json(); gotAt = Date.now(); fails = 0;
    document.body.classList.remove('is-lost');
  } catch {
    fails++;
    if (fails >= 2) {
      document.body.classList.add('is-lost');
      $('lost').innerHTML = `${icon('wifiOff')}<span>Lost contact with the NightWatch laptop${gotAt ? ` · last update ${esc(new Date(gotAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }))}` : ''} · reconnecting… Check the nurse station.</span>`;
    }
  }
  render();
  setTimeout(poll, fails ? Math.min(5000, 1000 * fails) : 1000);
}
setInterval(render, 1000);   // keeps "since" ticking between polls
poll();
})();
</script>
</body>
</html>
