<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Struggle Detector</title>
  <style>
    :root { --bg: #0f1419; --panel: #182029; --ink: #e6edf3; --muted: #8b98a5; --line: #26313c;
            --calm: #3fb27f; --warn: #e3a72f; --hot: #e5534b; --accent: #6cb6ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 18px; margin: 0; }
    .badge { padding: 4px 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); font-size: 12px; color: var(--muted); }
    .badge b { color: var(--ink); }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; padding: 16px; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
    .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
    .big { font-size: 56px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    .meter { height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; margin: 12px 0 6px; position: relative; }
    .meter > div { height: 100%; transition: width .4s, background .4s; }
    .meter .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .6; }
    .sub { color: var(--muted); font-size: 12px; }
    svg { width: 100%; height: 140px; display: block; }
    ul { list-style: none; padding: 0; margin: 0; max-height: 260px; overflow-y: auto; }
    li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    li .k { font-size: 11px; color: var(--muted); margin-right: 6px; }
    li.help { color: var(--calm); } li.label { color: var(--warn); } li.help-off { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 5px 4px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 500; }
    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .compare div { background: var(--bg); border-radius: 8px; padding: 10px; }
    .compare b { display: block; font-size: 22px; }
    .wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header>
    <h1>Struggle Detector</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="badge">Model <b id="scorer">–</b></span>
      <span class="badge">On <b id="device">–</b></span>
      <span class="badge">Per score <b id="lat">–</b></span>
      <span class="badge">Data sent off-device <b>0 bytes</b></span>
    </div>
  </header>
  <main>
    <section class="panel">
      <h2>Frustration now</h2>
      <div class="big" id="score">–</div>
      <div class="meter"><div id="bar" style="width:0"></div><span class="mark" id="mark"></span></div>
      <div class="sub" id="behavior">behavior –</div>
    </section>
    <section class="panel">
      <h2>Heart rate (watch)</h2>
      <div class="big" id="hr">–</div>
      <div class="sub" id="hrsub">no watch connected</div>
    </section>
    <section class="panel wide">
      <h2>Last 3 minutes</h2>
      <svg id="chart" viewBox="0 0 600 140" preserveAspectRatio="none" aria-label="Frustration over time"></svg>
    </section>
    <section class="panel">
      <h2>What the detector did</h2>
      <ul id="events"></ul>
    </section>
    <section class="panel">
      <h2>Help ON vs OFF</h2>
      <div class="compare">
        <div>Help ON<b id="on-avg">–</b><span class="sub" id="on-n"></span></div>
        <div>Help OFF<b id="off-avg">–</b><span class="sub" id="off-n"></span></div>
      </div>
      <table><thead><tr><th>Session</th><th>Help</th><th>Result</th><th>Time</th><th>Hints</th><th>F8</th></tr></thead>
        <tbody id="sessions"></tbody></table>
    </section>
  </main>
<script>
const $ = (id) => document.getElementById(id);
const color = (s, t) => (s >= t ? 'var(--hot)' : s >= t * 0.7 ? 'var(--warn)' : 'var(--calm)');

function chart(history, threshold) {
  const svg = $('chart');
  if (!history.length) { svg.innerHTML = ''; return; }
  const n = history.length, x = (i) => (i / Math.max(n - 1, 1)) * 600, y = (v) => 135 - v * 130;
  const line = (key) => history.map((h, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(h[key]).toFixed(1)}`).join('');
  svg.innerHTML = `
    <line x1="0" x2="600" y1="${y(threshold)}" y2="${y(threshold)}" stroke="var(--hot)" stroke-dasharray="4 4" opacity=".6"/>
    <path d="${line('behavior')}" fill="none" stroke="var(--muted)" stroke-width="1.5" opacity=".7"/>
    <path d="${line('score')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
}

function summary(list) {
  const done = list.filter((s) => s.completed !== null);
  if (!done.length) return ['–', 'no sessions yet'];
  const ok = done.filter((s) => s.completed);
  const avg = ok.length ? Math.round(ok.reduce((a, s) => a + s.duration_s, 0) / ok.length) + ' s' : '–';
  return [avg, `${ok.length}/${done.length} finished`];
}

async function tick() {
  try {
    const s = await (await fetch('/api/state')).json();
    const t = s.trigger.score;
    $('scorer').textContent = s.scorer.name;
    $('device').textContent = s.scorer.device;
    $('lat').textContent = s.scorer.p50_ms == null ? '–' : `${s.scorer.p50_ms.toFixed(2)} ms (p95 ${s.scorer.p95_ms.toFixed(2)})`;
    const last = s.history[s.history.length - 1];
    const score = last ? last.score : 0;
    $('score').textContent = last ? Math.round(score * 100) + '%' : '–';
    $('score').style.color = color(score, t);
    $('bar').style.width = score * 100 + '%';
    $('bar').style.background = color(score, t);
    $('mark').style.left = t * 100 + '%';
    $('behavior').textContent = last ? `behavior ${Math.round(last.behavior * 100)}% · helps after ${s.trigger.seconds}s above ${Math.round(t * 100)}%` : 'waiting for a session';
    $('hr').textContent = s.hr.bpm ? Math.round(s.hr.bpm) : '–';
    $('hrsub').textContent = s.hr.bpm
      ? `${s.hr.fresh ? 'live' : 'stale'} · ${s.hr.source} · resting ${s.hr.baseline ? Math.round(s.hr.baseline) : '…'} bpm`
      : 'no watch connected';
    chart(s.history, t);
    $('events').innerHTML = s.events.map((e) => `<li class="${e.kind}"><span class="k">${e.t}</span>${e.text.replace(/</g, '&lt;')}</li>`).join('');
    $('sessions').innerHTML = s.sessions.slice().reverse().map((x) => `<tr><td>${x.id}</td><td>${x.assist ? 'ON' : 'OFF'}</td>
      <td>${x.completed === null ? 'in progress' : x.completed ? 'done' : 'gave up'}</td><td>${x.duration_s}s</td><td>${x.helps}</td><td>${x.labels}</td></tr>`).join('');
    const [onAvg, onN] = summary(s.sessions.filter((x) => x.assist));
    const [offAvg, offN] = summary(s.sessions.filter((x) => !x.assist));
    $('on-avg').textContent = onAvg; $('on-n').textContent = onN;
    $('off-avg').textContent = offAvg; $('off-n').textContent = offN;
  } catch (e) { /* server restarting */ }
}
setInterval(tick, 500); tick();
</script>
</body>
</html>
